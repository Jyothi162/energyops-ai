
services:
  api:
    build: .
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
      DATABASE_PATH: /app/data/energyops.db
      CHROMA_PATH: /app/data/chroma_db
    volumes:
      - energyops_data:/app/data
    command:
      - sh
      - -c
      - |
        python startup.py &&
        exec python -m uvicorn api:app --host 0.0.0.0 --port 8000

  streamlit:
    build: .
    ports:
      - "127.0.0.1:8502:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    command:
      - python
      - -m
      - streamlit
      - run
      - app.py
      - --server.address
      - "0.0.0.0"
      - --server.port
      - "8501"

volumes:
  energyops_data:
